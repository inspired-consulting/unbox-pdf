# Dependabot opens pull requests for outdated dependencies and workflow actions.
# The samples project under samples/ depends only on this library and is not covered.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Plugins and test libraries move together; PDFBox stays separate because a
      # major update changes the rendering output and needs the migration assessment.
      build-and-test:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.junit.jupiter:*"
    ignore:
      - dependency-name: "org.apache.pdfbox:pdfbox"
        update-types: ["version-update:semver-major"]
      # Maven 3.10 names the staged metadata file differently, and
      # central-publishing-maven-plugin 0.11.0 then uploads it in the bundle,
      # which Maven Central rejects. Remove this entry once the plugin handles it.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">=3.10.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
